version: 2

sources:
  - name: t212_raw
    database: t212-project
    schema: t212_raw
    tables:
      - name: raw_orders_history
      - name: raw_open_positions
      - name: raw_exchange_rates
      - name: raw_dividends
      - name: raw_tradable_stocks

models:
  - name: stg_orders_history
    columns:
      - name: order_id
        tests:
          - not_null

  - name: stg_open_positions
    columns:
      - name: ticker
        tests:
          - not_null
      - name: extract_timestamp
        tests:
          - not_null
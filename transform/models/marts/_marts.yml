version: 2

models:
  - name: fct_orders
    columns:
      - name: order_id
        tests: [not_null, unique]
      - name: isin
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_instruments')
                field: isin

  - name: fct_positions_current
    columns:
      - name: isin
        tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dim_instruments')
                field: isin

  - name: fct_dividends
    columns:
      - name: dividend_id
        tests: [not_null, unique]
      - name: isin
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_instruments')
                field: isin